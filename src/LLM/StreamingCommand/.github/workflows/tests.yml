name: package
on: [push, pull_request]
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      STREAMINGCOMMAND_CONFIG: ${{ github.workspace }}/.test-config
      STREAMINGCOMMAND_CACHE: ${{ github.workspace }}/.test-cache
      STREAMINGCOMMAND_LOGS: ${{ github.workspace }}/.test-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m build
