[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamingcommand"
version = "0.1.1"
description = "Local streaming speech recognition and trained command clarification"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3", "platformdirs>=4", "filelock>=3.13",
  "huggingface-hub>=0.30,<2", "soundfile>=0.12", "sounddevice>=0.5",
  "soxr>=0.5", "webrtcvad-wheels==2.0.14",
  "torch>=2.9,<3", "transformers>=5.14,<6", "peft>=0.20,<1",
  "safetensors>=0.6", "accelerate>=1.0", "onnxruntime>=1.20,<2",
  "funasr>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
speech = ["kokoro>=0.9.4,<1"]

[project.scripts]
streaming-command = "streamingcommand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamingcommand = ["assets/**/*", "workers/**/*"]

[tool.setuptools.data-files]
"share/doc/streamingcommand" = ["doc/API.md", "docs/VLLM_WINDOWS.md", "docs/VALIDATION.md", "docs/DEMO_INTEGRATION.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
streamingcommand = ["assets/models/**/*"]
